# EC2 배포 경로: /etc/nginx/sites-available/duckspace (심볼릭 링크: /etc/nginx/sites-enabled/duckspace)
# 인증서는 Certbot(Let's Encrypt)이 자동 발급/갱신함: sudo certbot --nginx -d duckspace.cloud -d www.duckspace.cloud
server {
    server_name duckspace.cloud www.duckspace.cloud;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/duckspace.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/duckspace.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.duckspace.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = duckspace.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name duckspace.cloud www.duckspace.cloud;
    return 404; # managed by Certbot
}
