# 테스트도 운영과 같은 MySQL 로 돕니다.
#
# H2 로 돌리면 미묘한 차이 때문에 "로컬에선 됐는데 서버에서 안 되는" 사고가 납니다.
# 실제로 ExhibitionItem.status 에서 H2 가 잘못된 check 제약을 만들어 INSERT 가 전부 실패한 적이 있습니다.
#
# 로컬:  docker compose up -d  (docker-compose.yml 이 duckspace_test DB 도 함께 만듭니다)
# CI:    ci-check.yml 의 mysql service container
jwt:
  secret: test-only-secret-key-do-not-use-in-production-0123456789

# 키를 비워둬야 AbstractOpenAiSummaryClient 가 비활성 경로를 탑니다.
# 값이 있으면(더미여도) enabled 로 판정돼서, 테스트를 돌릴 때마다 api.openai.com 으로
# 실제 요청이 나갑니다 — PopupAdminSmokeTest 가 create/update 를 태우기 때문입니다.
# 401 을 받고 null 로 폴백돼 테스트는 통과하지만, 외부 네트워크에 의존하게 됩니다.
openai:
  api-key:
  model: gpt-4o-mini

# 테스트에는 AWS 자격증명이 없습니다.
storage:
  type: local

spring:
  # @DataJpaTest 는 기본적으로 데이터소스를 내장 DB로 바꿔치기합니다. 그러면 아래 설정이 무시되므로 끕니다.
  test:
    database:
      replace: none
  datasource:
    url: jdbc:mysql://localhost:3306/duckspace_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: duckspace
    password: duckspace
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
