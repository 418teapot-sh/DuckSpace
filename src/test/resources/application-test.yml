# 테스트 전용 프로필. Docker 없이도 테스트와 CI가 돌아가도록 H2 인메모리를 씁니다.
# MODE=MySQL 로 두어 MySQL 문법 차이를 최대한 줄입니다.
#
# 주의: 복잡한 집계 쿼리를 검증하는 테스트를 작성한다면 H2와 MySQL의 동작이 다를 수 있습니다.
#       그 시점에는 CI에 MySQL service container 를 추가하는 편이 안전합니다.
jwt:
  secret: test-only-secret-key-do-not-use-in-production-0123456789

spring:
  datasource:
    url: jdbc:h2:mem:duckspace-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
