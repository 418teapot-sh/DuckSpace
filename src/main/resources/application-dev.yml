spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  # nginx가 HTTPS를 종료하고 Spring에는 HTTP로 전달합니다.
  # 없으면 redirect_uri 등이 http://로 잘못 생성됩니다.
  forward-headers-strategy: framework
