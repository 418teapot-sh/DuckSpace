name: Deploy to EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Backup current jar
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            JAR=/home/ubuntu/DuckSpace/build/libs/duckspace-0.0.1-SNAPSHOT.jar
            [ -f "$JAR" ] && cp "$JAR" "$JAR.bak" || true

      - name: Copy jar to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/DuckSpace/build/libs/"
          strip_components: 2

      - name: Restart service and health check
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            JAR=/home/ubuntu/DuckSpace/build/libs/duckspace-0.0.1-SNAPSHOT.jar
            sudo systemctl restart duckspace
            for i in $(seq 1 20); do
              curl -sf http://localhost:8080/actuator/health > /dev/null && echo "healthy" && exit 0
              sleep 3
            done
            echo "헬스체크 실패 — 이전 버전으로 롤백합니다"
            if [ -f "$JAR.bak" ]; then
              cp "$JAR.bak" "$JAR"
              sudo systemctl restart duckspace
            fi
            exit 1
